name: Manuscript verification and build
on:
  push:
    paths:
      - '.github/workflows/manuscript-checks.yml'
      - 'paper/**'
      - 'code/**'
      - 'docs/**'
      - 'results/**'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Remove checked-in PDF before verification
        run: rm -f paper/emit_kernel_dnn.pdf paper/supplement.pdf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Check identities, projections, precision and physical-domain semantics
        run: python -m unittest discover -s code -p 'test_*.py' -v
      - name: Regenerate the tables from the run records
        run: |
          python code/make_width_numbers.py
          python code/make_scaling_tables.py
          python code/make_retune_table.py
          python code/make_emit_tables.py
          python code/make_tables.py
          python code/make_v2_tables.py
          python code/format_publication_tables.py
          python code/make_domain_table.py
          python code/make_tq_tables.py
          python code/make_lrt_tables.py
          python code/make_lrt_tables.py lrt
          python code/make_confirmation_table.py
      - name: Check that the committed tables are the regenerated ones
        shell: bash
        run: |
          changed="$(git status --porcelain -- 'paper/table_*.tex' 'paper/layout_*.tex')"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- 'paper/table_*.tex' 'paper/layout_*.tex' | head -200
            exit 1
          fi
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
      - name: Compile the article and its supplement and check references and layout
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          # the two documents cite each other through xr-hyper: the supplement is compiled once so that its labels
          # exist, then the article, then the supplement again against the article's final numbering
          (cd paper && pdflatex -interaction=nonstopmode -halt-on-error supplement.tex > /dev/null)
          latexmk -pdf -interaction=nonstopmode -halt-on-error -cd paper/emit_kernel_dnn.tex
          latexmk -g -pdf -interaction=nonstopmode -halt-on-error -cd paper/supplement.tex
          for doc in emit_kernel_dnn supplement; do
            if grep -Eq 'There were undefined references|There were multiply-defined labels|Citation .* undefined|Reference .* undefined|Overfull \\(hbox|vbox)|Float too large' paper/$doc.log; then
              echo "$doc has unresolved references or overflowing content."
              exit 1
            fi
          done
      - name: Record build provenance
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/commit.txt
          python --version > build/environment.txt
          python -m pip freeze >> build/environment.txt
          if command -v pdflatex >/dev/null; then pdflatex --version >> build/environment.txt; fi
          for doc in emit_kernel_dnn supplement; do
            if test -f paper/$doc.pdf; then sha256sum paper/$doc.pdf >> build/pdf-sha256.txt; fi
            if test -f paper/$doc.log; then cp paper/$doc.log build/latex-$doc.log; fi
          done
      - name: Archive manuscript, sources and diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-manuscript
          path: |
            paper/*.tex
            paper/*.pdf
            paper/abstract.txt
            code/*.py
            docs/*.md
            results/
            figures/
            build/
            README.md
            LICENSE
            requirements.txt
          retention-days: 30
          if-no-files-found: error
      - name: Archive failed-build diagnostics without a PDF
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-build-failure-logs
          path: |
            build/
            paper/*.log
          retention-days: 7
