name: Manuscript checks and source archive
on:
  push:
    paths:
      - '.github/workflows/manuscript-checks.yml'
      - 'paper/**'
      - 'code/**'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source and stored evidence
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-source
          path: |
            paper/
            code/
            docs/
            results/
            figures/
            README.md
            LICENSE
          retention-days: 7
          if-no-files-found: error
