name: Build reviewed publication revision
on:
  push:
    branches: ['revision/publication-2026-09-21']
    paths: ['.github/workflows/revision-workbench.yml']
permissions:
  contents: write
jobs:
  publish-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source revision with original and final checksums
        run: |
          python revisions/apply_publication_20260921.py
          python revisions/finalize_publication_20260921.py
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-revision.txt
      - name: Run all mathematical and implementation regression checks
        run: python -m unittest discover -s code -p 'test_*.py' -v
      - name: Reproduce the synthetic reference and regenerate supported tables
        run: |
          python code/sharpness_synthetic.py results/sharpness_synthetic.json
          python code/make_revision_tables.py
          python code/make_tables.py
          python code/make_v2_tables.py
          python code/format_publication_tables.py
          python code/revision_manifest.py
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
      - name: Compile and reject unresolved references or overflowing content
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          latexmk -pdf -interaction=nonstopmode -halt-on-error -cd paper/emit_kernel_dnn.tex
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined|Overfull \\(hbox|vbox)|Float too large' paper/emit_kernel_dnn.log; then
            echo 'Unresolved references or overflowing content.'
            exit 1
          fi
      - name: Commit the verified source and compiled paper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm revisions/publication-20260921-{1,2,3,4}.b64 revisions/apply_publication_20260921.py revisions/finalize_publication_20260921.py .github/workflows/revision-workbench.yml
          git add .github/workflows/manuscript-checks.yml README.md code/*.py docs/*.md paper/*.tex paper/abstract.txt paper/emit_kernel_dnn.pdf results/revision_20260921/reanalysis.json results/sharpness_synthetic.json
          git commit -m 'Rewrite manuscript: reconcile stacking theory, separate precision cohorts, document evidence and repair tables'
          git push origin HEAD:revision/publication-2026-09-21
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Save build provenance
        if: always()
        run: |
          mkdir -p build
          git rev-parse HEAD > build/commit.txt
          python --version > build/environment.txt
          python -m pip freeze >> build/environment.txt
          if command -v pdflatex >/dev/null; then pdflatex --version >> build/environment.txt; fi
          if test -f paper/emit_kernel_dnn.pdf; then sha256sum paper/emit_kernel_dnn.pdf > build/pdf-sha256.txt; fi
          if test -f paper/emit_kernel_dnn.log; then cp paper/emit_kernel_dnn.log build/latex.log; fi
      - name: Archive source and compiled manuscript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-publication
          path: |
            paper/*.tex
            paper/*.pdf
            paper/abstract.txt
            code/*.py
            docs/*.md
            results/
            figures/
            build/
            README.md
            LICENSE
            requirements-revision.txt
          retention-days: 30
          if-no-files-found: error
